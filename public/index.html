.fab{position:absolute;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));box-shadow:0 6px 20px rgba(0,0,0,.28);z-index:3}

</style>

<body>
<div class="app" id="app"><div class="center"><div><div class="spin"></div>Завантаження…</div></div></div>

<script>
'use strict';
/* ---------- Telegram і тема ---------- */
var tg=window.Telegram&&window.Telegram.WebApp;
function applyTheme(){
  var scheme=tg&&tg.initData?tg.colorScheme:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',scheme);
  var bg=getComputedStyle(document.documentElement).getPropertyValue('--surface').trim();
  try{if(tg){tg.setHeaderColor(bg);tg.setBackgroundColor(getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());tg.setBottomBarColor&&tg.setBottomBarColor(bg)}}catch(e){}
}
function syncFs(){document.documentElement.classList.toggle('fs',!!(tg&&tg.isFullscreen))}
if(tg){tg.ready();tg.expand();syncFs();try{tg.onEvent('fullscreenChanged',syncFs)}catch(e){}try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}tg.onEvent('themeChanged',applyTheme)}
applyTheme();
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!(tg&&tg.initData))applyTheme()});

/* ---------- API ---------- */
function api(path,opts){
  opts=opts||{};
  return fetch(path,{method:opts.method||'GET',headers:Object.assign({'X-Init-Data':(tg&&tg.initData)||'','Content-Type':'application/json'},opts.headers||{}),body:opts.body?JSON.stringify(opts.body):undefined})
   .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'error');e.status=r.status;e.data=j;throw e}return j})});
}

/* ---------- Допоміжне ---------- */
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}
function fmt(d){var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function wds(d){return['нд','пн','вт','ср','чт','пт','сб'][new Date(d+'T12:00:00').getDay()]}
function wd(d){return new Date(d+'T12:00:00').toLocaleDateString('uk-UA',{weekday:'long'})}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cachedAva(id){var c=lsGet('av:'+id);if(!c)return undefined;var age=Date.now()-c.t;if(c.d&&age<3*864e5)return c.d;if(!c.d&&age<2*36e5)return 0;return undefined}
function avatar(id,name,cls){
  if(id&&S.ava[id]===undefined){var ca=cachedAva(id);if(ca!==undefined)S.ava[id]=ca}
  var u=id&&S.ava[id];
  if(u)return '<img class="ava'+(cls?' '+cls:'')+'" src="'+u+'" alt="">';
  var ini=String(name||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w.charAt(0).toUpperCase()}).join('');
  return '<span class="ava'+(cls?' '+cls:'')+'"'+(id?' data-ava="'+id+'"':'')+' aria-hidden="true">'+esc(ini)+'</span>'}
function personId(svc,name){
  var id='';(svc.lineup||[]).forEach(function(r){var i=r.names.indexOf(name);if(!id&&i>-1&&r.ids)id=r.ids[i]||''});
  if(!id&&svc.lead){var j=svc.lead.indexOf(name);if(j>-1&&svc.leadIds)id=svc.leadIds[j]||''}
  return id}
function swapAva(id){
  var u=S.ava[id];if(!u)return;
  Array.prototype.forEach.call(document.querySelectorAll('[data-ava="'+id+'"]'),function(el){var im=document.createElement('img');im.className=el.className;im.src=u;im.alt='';el.replaceWith(im)})}
function loadAvatars(){
  var els=document.querySelectorAll('[data-ava]'),ids={};
  Array.prototype.forEach.call(els,function(e){var id=e.dataset.ava;if(S.ava[id]===undefined){var ca=cachedAva(id);if(ca!==undefined){S.ava[id]=ca;if(ca)swapAva(id);return}ids[id]=1}});
  Object.keys(ids).forEach(function(id){
    S.ava[id]=0;
    fetch('/api/avatar?id='+id,{headers:{'X-Init-Data':(tg&&tg.initData)||''}}).then(function(r){if(r.status===404){lsSet('av:'+id,{t:Date.now(),d:''});throw 0}if(!r.ok)throw 0;return r.blob()}).then(function(b){
      var fr=new FileReader();fr.onload=function(){S.ava[id]=fr.result;lsSet('av:'+id,{t:Date.now(),d:fr.result});swapAva(id)};fr.readAsDataURL(b)}).catch(function(){})})}
function smallCover(u){return String(u||'').replace('/albums/520/','/albums/284/')}
function cover(s,cls){
  var t=String(s.title||'?'),h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;
  var dot=STATUS_DOT[s.status];
  return '<span class="covw"><span class="cov'+(cls?' '+cls:'')+'" style="--h:'+h+'" aria-hidden="true"><span>'+esc(t.charAt(0).toUpperCase())+'</span>'+(s.cover?'<img src="'+esc(smallCover(s.cover))+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">':'')+'</span>'+(dot?'<i class="sdot '+dot+(cls?' '+cls:'')+'" title="'+esc(s.status)+'" aria-label="'+esc(s.status)+'" role="img"></i>':'')+'</span>'}
var STATUS_DOT={'Зелені':'ok','Жовті':'warn'};
var MONTHS=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
function fmtD(n){return Math.floor(n/60)+':'+('0'+(n%60)).slice(-2)}
var ICON_SHARE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3 11 14"/><path d="M22 3 15 22l-4-8-8-4z"/></svg>';
var ICON_LIVE='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M10 8.5v4l3.5-2z"/><path d="M8 21h8M12 17v4"/></svg>';
var ICON_COPY='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
function stats(items){var n=0,sum=0,unk=0;items.forEach(function(x){if(x.t!=='song')return;n++;var d=song(x.id).dur;if(d)sum+=d;else unk++});return{n:n,sum:sum,unk:unk}}
function totText(st){return st.n+' '+(st.n===1?'пісня':st.n<5?'пісні':'пісень')+(st.sum?' · ≈'+Math.round(st.sum/60)+' хв':'')}
function ytUrl(u){
  try{var x=new URL(u),id=x.hostname==='youtu.be'?x.pathname.slice(1):x.searchParams.get('v');if(!id)return u;
   var t=(x.searchParams.get('t')||'').replace(/s$/,'');return 'https://youtu.be/'+id+(/^\d+$/.test(t)&&t!=='0'?'?t='+t:'')}catch(e){return u}}
function lineParts(items){var n=0;return items.map(function(it){if(it.t!=='song')return{pre:'',title:it.x,post:'',url:''};n++;var s=song(it.id),k=it.k||s.our;return{pre:n+'. ',title:s.title,post:(k?' '+k:'')+(it.v?' - '+it.v:''),url:s.yt?ytUrl(s.yt):''}})}
function listText(items){return lineParts(items).map(function(l){return l.pre+l.title+l.post}).join('\n')}
function listHtml(items){return lineParts(items).map(function(l){return esc(l.pre)+(l.url?'<a href="'+esc(l.url)+'">'+esc(l.title)+'</a>':esc(l.title))+esc(l.post)}).join('<br>')}
function copyItems(items){var txt=listText(items),html=listHtml(items),links=lineParts(items).some(function(l){return l.url});
 function plain(){var a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();toast('Сет-лист скопійовано'+(links?' (без посилань)':''))}
 function plainApi(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast('Сет-лист скопійовано'+(links?' (без посилань)':''))},plain);else plain()}
 if(links&&window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){
  navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(function(){toast('Сет-лист скопійовано з посиланнями')},plainApi)}
 else plainApi()}
function shareItems(items){
  if(!(tg&&tg.initData&&tg.shareMessage)){toast('Поділитись можна лише в оновленому Telegram');return}
  api('/api/share',{method:'POST',body:{items:items}}).then(function(r){tg.shareMessage(r.id,function(ok){if(ok)toast('Сет-лист надіслано')})}).catch(function(e){toast('Не вдалося підготувати: '+((e.data&&e.data.message)||e.message))})}
function defVoc(svc){var l=(svc.lead||[])[0];return l&&(svc.vocalists||[]).indexOf(l)>-1?l:''}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
var SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
var ROOTS=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
function idx(k){var m=/^([A-G])([#b]?)/.exec(k||'');if(!m)return 0;var i=SHARP.indexOf(m[1]);if(m[2]==='#')i++;if(m[2]==='b')i--;return(i+12)%12}
function flatKey(k){return /^(F(?!#)|[A-G]b)/.test(k||'')}
function tNote(r,n,flat){return(flat?FLAT:SHARP)[(idx(r)+n+120)%12]}
function tChord(c,n,flat){var m=/^([A-G][#b]?)(.*)$/.exec(c);if(!m)return c;var rest=m[2].replace(/\/([A-G][#b]?)/,function(_,b){return '/'+tNote(b,n,flat)});return tNote(m[1],n,flat)+rest}
var ACC=lsGet('acc');/* 'b' | '#' | null (авто) */
function useFlat(tk,acc){var a=acc===undefined?ACC:acc;return a==='b'?true:a==='#'?false:flatKey(tk)}
var NTX=!!lsGet('ntx');/* лише акорди, без тексту */
var ICON_NOTXT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h12M12 6v12"/><path d="M4 20 20 4" stroke-width="2.4"/></svg>';
function ntxBtn(on){return '<button class="iconbtn ntx" data-ntx aria-label="Показувати лише акорди" title="Лише акорди, без тексту" aria-pressed="'+(on===undefined?NTX:on)+'">'+ICON_NOTXT+'</button>'}
function chordBlock(sec,n,flat,style,px,ntx){var no=ntx===undefined?NTX:ntx,cols=no?colsFor(px||13.5):0;return '<div class="sec">'+(sec.h?'<h3>'+esc(sec.h)+'</h3>':'')+'<div class="chordblock"'+(style?' style="'+style+'"':'')+'>'+sec.lines.map(function(l){return no?(l.chs.length?chordLine(l.chs,n,flat,cols):null):(l.chs.length?chordLine(l.chs,n,flat)+'\n':'')+esc(l.t)}).filter(function(x){return x!==null}).join('\n')+'</div></div>'}
function accBtn(flat){return '<button class="iconbtn acc" data-acc aria-label="Дієзи або бемолі" title="Перемкнути дієзи та бемолі" aria-pressed="'+(flat?'true':'false')+'">'+(flat?'♭':'♯')+'</button>'}
function minor(k){return /m$/.test(k||'')}

/* ---------- Акорди (ChordPro) ---------- */
function parseChords(txt){
  var secs=[],cur={h:'',lines:[]};
  String(txt||'').split('\n').forEach(function(l){
    if(/^\s*#/.test(l)){if(cur.lines.length||cur.h)secs.push(cur);cur={h:l.replace(/^\s*#+\s*/,''),lines:[]};return}
    if(!l.trim())return;
    var chs=[],t='',last=0,re=/\[([^\]]+)\]/g,m;
    while((m=re.exec(l))){t+=l.slice(last,m.index);chs.push([m[1],t.length]);last=m.index+m[0].length}
    t+=l.slice(last);cur.lines.push({chs:chs,t:t});
  });
  if(cur.lines.length||cur.h)secs.push(cur);
  return secs;
}
function chordLine(chs,n,flat,maxCols){
  var cs=[],len=0;chs.forEach(function(p,i){var c=tChord(p[0],n,flat),pad=Math.max(p[1]-len,len?1:0);cs.push({c:c,pad:pad});len+=pad+c.length});
  if(maxCols&&len>maxCols){/* лише без тексту: стискаємо проміжки між акордами, а не виходимо за ширину */
    var G=0;cs.forEach(function(x,i){G+=Math.max(0,x.pad-(i?1:0))});
    if(G>0){var k=Math.max(0,(G-(len-maxCols))/G);cs.forEach(function(x,i){var m=i?1:0;x.pad=m+Math.floor((x.pad-m)*k)})}
    else cs.forEach(function(x,i){x.pad=i?1:0})}
  return cs.map(function(x){return ' '.repeat(x.pad)+'<span class="c">'+esc(x.c)+'</span>'}).join('')}
var CW=0;
function charW(){if(!CW){var sp=document.createElement('span');sp.style.cssText='position:absolute;visibility:hidden;white-space:pre;font:700 100px var(--font-mono)';sp.textContent='MMMMMMMMMM';document.body.appendChild(sp);CW=sp.getBoundingClientRect().width/1000;sp.remove()}return CW||0.6}
function colsFor(px){var app=document.getElementById('app'),w=(app?app.clientWidth:window.innerWidth)-32-28-2;return Math.max(8,Math.floor(w/(charW()*px))-1)}

/* ---------- Стан ---------- */
var S={me:null,songs:[],services:[],tab:'sunday',stack:[],sort:'az',f:'Усі',q:'',toast:'',cache:{},ava:{},pubView:{},past:{},hist:{items:[],loaded:false,more:false,busy:false},calMode:'next',edit:null,busy:false,err:null};
var byId={};
function song(id){return byId[id]||{id:id,title:'Невідома пісня',type:'',orig:'',our:'',n:0}}
function toast(m){
  var old=document.getElementById('toast');if(old)old.remove();
  var el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');el.textContent=m;document.body.appendChild(el);
  clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.add('out');setTimeout(function(){el.remove()},200)},2400)}
function svcById(id){return S.services.filter(function(s){return s.id===id})[0]||S.past[id]}
function mySunday(){var m=S.services.filter(function(s){return s.mine});if(m.length)return m[0];return S.me&&S.me.isAdmin?S.services[0]:null}

/* ---------- Екрани ---------- */
function setlistCard(items,svc){
  if(!items.length)return '<div class="card"><h2>Сет-лист</h2><div class="empty"><b>Сет-лист порожній</b>'+(svc.canEdit?'Натисніть «Редагувати», щоб додати пісні.':'Лід ще не опублікував список на це служіння.')+'</div></div>';
  var st=stats(items),n=0;
  return '<div class="card"><div class="sumline"><h2>Сет-лист</h2><button class="iconbtn" data-live="'+svc.id+'" aria-label="Режим служіння" title="Режим служіння: акорди всіх пісень підряд, екран не гасне">'+ICON_LIVE+'</button><button class="iconbtn" data-copy="'+svc.id+'" aria-label="Скопіювати текстом" title="Скопіювати текстом">'+ICON_COPY+'</button><button class="iconbtn" data-share="'+svc.id+'" aria-label="Надіслати в чат" title="Надіслати в чат">'+ICON_SHARE+'</button><span class="tot">'+totText(st)+(st.unk&&st.sum?'<br>без тривалості: '+st.unk:'')+'</span></div><div class="list">'+items.map(function(it){
   if(it.t==='mom')return '<div class="row moment"><span class="num"><i class="dotc"></i></span><span class="rowmain"><span class="rowtitle">'+esc(it.x)+'</span></span></div>';
   if(it.t==='note')return '<div class="noterow">'+esc(it.x)+'</div>';
   var s=song(it.id),k=it.k||s.our;n++;
   return '<button class="row" data-song="'+s.id+'" data-key="'+esc(k)+'"><span class="num">'+n+'</span><span class="rowmain"><span class="rowtitle">'+esc(s.title)+'</span></span>'+(it.v?'<span class="vline" title="'+esc(it.v)+'">'+avatar(personId(svc,it.v),it.v)+'</span>':'')+(it.link?'<span class="ytmini" data-yt="'+esc(it.link)+'" role="link" aria-label="Відкрити запис">'+YT_SVG+'</span>':'')+'<span class="key hi">'+esc(k||'–')+'</span><span class="chev">›</span></button>'}).join('')+'</div></div>'}

function shownItems(svc){return svc.canEdit?(S.pubView[svc.id]&&svc.hasChanges?(svc.published||[]):(svc.draft||[])):(svc.published||[])}
function lineupHtml(svc){return (svc.lineup||[]).map(function(r){return '<dt>'+esc(r.role)+'</dt><dd>'+r.names.map(function(n,ni){return '<span class="who'+(r.lead&&r.lead.indexOf(n)>-1?' lead':'')+'">'+avatar(r.ids&&r.ids[ni],n,r.lead&&r.lead.indexOf(n)>-1?'ring':'')+esc(n)+'</span>'}).join('')+'</dd>'}).join('')}
function serviceBody(svc){
  var items=shownItems(svc),showPub=svc.canEdit&&svc.hasChanges&&S.pubView[svc.id];
  if(svc.past)return '<div class="hero"><span class="eyebrow">'+esc(svc.type||'Служіння')+'</span><div class="date">'+fmt(svc.date)+'</div><div class="meta">'+wd(svc.date)+(svc.lead.length?' · лід: '+esc(svc.lead.join(', ')):'')+'</div><div><span class="pill" style="background:var(--surface2);color:var(--ink2)"><span class="dot"></span>Минуле служіння</span></div></div>'
   +((svc.lineup||[]).length?'<div class="card"><h2>Склад</h2><dl class="lineup">'+lineupHtml(svc)+'</dl></div>':'')+setlistCard(items,svc);
  var status=svc.canEdit?(svc.hasChanges?'<span class="pill warn"><span class="dot"></span>Є неопубліковані зміни</span>':(svc.published&&svc.published.length?'<span class="pill"><span class="dot"></span>Опубліковано для команди</span>':'<span class="pill warn"><span class="dot"></span>Ще не опубліковано</span>')):(svc.published&&svc.published.length?'<span class="pill"><span class="dot"></span>Сет-лист від ліда</span>':'<span class="pill warn"><span class="dot"></span>Сет-лист ще не опубліковано</span>');
  var lu=lineupHtml(svc);
  return '<div class="hero"><span class="eyebrow">'+esc(svc.type||'Служіння')+'</span><div class="date">'+fmt(svc.date)+'</div><div class="meta">'+wd(svc.date)+(svc.lead.length?' · лід: '+esc(svc.lead.join(', ')):' · лід не призначений')+'</div><div>'+status+'</div></div>'
   +(lu?'<div class="card"><h2>Склад</h2><dl class="lineup">'+lu+'</dl></div>':'')
   +(svc.canEdit&&svc.hasChanges?'<div class="seg" role="group" aria-label="Що показувати"><button data-pubview="'+svc.id+':0" aria-pressed="'+(!showPub)+'">Моя чернетка</button><button data-pubview="'+svc.id+':1" aria-pressed="'+(!!showPub)+'">Опубліковано</button></div>':'')
   +setlistCard(items,svc)
   +(svc.canEdit?'<button class="btn wide" data-edit="'+svc.id+'">Редагувати сет-лист</button>':'<div class="note">Сет-лист складає лід. Ви бачите його лише для перегляду.</div>')}

function viewSunday(){
  var svc=mySunday();
  if(!svc){
    if(!S.services.length)return '<div class="pad"><div class="hero"><span class="eyebrow">Найближчий місяць</span><div class="t2">Служінь на найближчі 30 днів ще немає</div><div class="meta">Коли їх додадуть у Notion, вони з\'являться тут.</div></div></div>';

var cachedBoot=uid?lsGet(BOOT_KEY):null;
if(cachedBoot&&cachedBoot.uid===uid&&Date.now()-cachedBoot.t<7*864e5){applyBoot(cachedBoot.r);S.counts=cachedBoot.counts||{};S.songs.forEach(function(x){if(S.counts[x.id])x.n=S.counts[x.id]});render()}
function loadCounts(){api('/api/counts').then(function(c){S.counts=c.counts;S.songs.forEach(function(x){x.n=c.counts[x.id]||0});render();if(uid)lsSet(BOOT_KEY,{uid:uid,t:Date.now(),r:{me:S.me,songs:S.songs,services:S.services},counts:c.counts})}).catch(function(){})}
api('/api/bootstrap').then(function(r){
  applyBoot(r);render();
  if(uid)lsSet(BOOT_KEY,{uid:uid,t:Date.now(),r:{me:S.me,songs:S.songs,services:S.services},counts:S.counts||{}});
  loadCounts();
  api('/api/ping',{method:'POST'}).catch(function(){});
}).catch(function(e){
  if(e.status===401)fail('Відкрийте через Telegram','Цей застосунок працює лише всередині Telegram, через кнопку бота.');
  else if(S.me&&e.status!==403){toast('Немає зв\'язку, показано збережені дані')}
  else if(e.status===403)fail('Вас немає в базі','Telegram ID '+esc(e.data&&e.data.chatId)+' не знайдено в базі «Люди». Попросіть адміна додати вас.');
  else fail('Не вдалося завантажити',esc((e.data&&e.data.message)||e.message));
});
